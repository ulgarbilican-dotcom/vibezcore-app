/* ─────────────────────────────────────────────────────────────────────────
   VIBEZCORE — Wear OS companion-app (embedded, geen standalone-app).

   Leeft hier buiten `android/` omdat `expo prebuild` die map elke keer
   opnieuw aanmaakt (zie plugins/withQuickShortcuts.js voor dezelfde
   constatering) — `plugins/withWearApp.js` kopieert deze map naar
   `android/wear` en haakt hem in settings.gradle/app/build.gradle in bij
   elke prebuild. Niet rechtstreeks in `android/wear` bewerken: dat
   verdwijnt bij de volgende prebuild. */

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
  namespace 'com.ubili.vibezcoreapp.wear'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    /* Zelfde applicationId als de telefoon-app — conventie voor een
       EMBEDDED (niet-standalone) Wear-app die via `wearApp project(':wear')`
       in de telefoon-APK verpakt wordt. */
    applicationId 'com.ubili.vibezcoreapp'
    minSdkVersion 30
    targetSdkVersion rootProject.ext.targetSdkVersion
    /* 14 okt 2026 (audit): Play eist een uniek, stijgend versienummer per
       upload, ook naast de telefoon-app (die zit onder de 1000). Standaard
       jjMMddUU (bv. 26101423 = 14 okt 2026, 23 u); vast zetten kan met
       -PwearVersionCode=… */
    versionCode project.hasProperty('wearVersionCode') ? project.property('wearVersionCode').toString().toInteger() : new Date().format('yyMMddHH').toInteger()
    versionName "1.0.0"
  }

  /* 12 okt 2026: zelfde debug-sleutel als de telefoon-app (android/app/
     debug.keystore). Google Play Services levert berichten tussen telefoon
     en horloge ENKEL tussen apps met dezelfde handtekening — met de
     standaard ~/.android-sleutel kwam er niets aan (getest op Watch4). */
  signingConfigs {
    debug {
      storeFile file('../app/debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    /* Upload-sleutel voor de Play Console (14 okt 2026): uit
       wear-app/keystore.properties (staat NIET in git) — zie
       docs/WEAR_RELEASE.md. Zonder dat bestand: geen release-handtekening. */
    def ksFile = rootProject.file('../wear-app/keystore.properties')
    if (ksFile.exists()) {
      def ks = new Properties()
      ksFile.withInputStream { ks.load(it) }
      release {
        storeFile rootProject.file('../' + ks['storeFile'])
        storePassword ks['storePassword']
        keyAlias ks['keyAlias']
        keyPassword ks['keyPassword']
      }
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      minifyEnabled false
      if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  /* 12 okt 2026: ambient-modus + Ongoing Activity (sessie blijft bereikbaar). */
  implementation 'androidx.activity:activity-ktx:1.9.3'
  implementation 'androidx.wear:wear:1.3.0'
  implementation 'androidx.wear:wear-ongoing:1.0.0'
  implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
