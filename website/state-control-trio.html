      if(h) h.style.transform='scale('+(ads[i].clientWidth/403)+')';
    }
  }
  fit(); window.addEventListener('resize',fit);
  if(window.ResizeObserver){ try{ new ResizeObserver(fit).observe(root); }catch(e){} }

  /* 2 ── golf (components/LiquidWave.tsx): zelfde pad, amplitude en kleursterkte (10 % / 15 %) */
  var NS='http://www.w3.org/2000/svg';
  function wavePath(S,y,amp){
    var p=S, bottom=Math.max(S,y+amp)+2;
    return 'M0 '+y+' C '+p*.25+' '+(y-amp)+', '+p*.25+' '+(y+amp)+', '+p*.5+' '+y+
      ' C '+p*.75+' '+(y-amp)+', '+p*.75+' '+(y+amp)+', '+p+' '+y+
      ' C '+p*1.25+' '+(y-amp)+', '+p*1.25+' '+(y+amp)+', '+p*1.5+' '+y+
      ' C '+p*1.75+' '+(y-amp)+', '+p*1.75+' '+(y+amp)+', '+p*2+' '+y+
      ' L '+p*2+' '+bottom+' L 0 '+bottom+' Z';
  }
  function makeWave(host,S){
    var out={S:S};
    ['back','front'].forEach(function(k){
      var wrap=document.createElement('div'); wrap.className='wv '+k; wrap.style.cssText='width:'+S+'px;height:'+S+'px';
      wrap.style.setProperty('--wd',(-S)+'px');
      var svg=document.createElementNS(NS,'svg'); svg.setAttribute('width',S*2); svg.setAttribute('height',S);
      var path=document.createElementNS(NS,'path'); path.setAttribute('fill',VZ); path.setAttribute('fill-opacity',k==='back'?'.1':'.15');
      svg.appendChild(path); wrap.appendChild(svg); host.appendChild(wrap); out[k]=path;
    });
    out.set=function(waterY){
      out.back.setAttribute('d',wavePath(S,waterY+S*.027,S*.04));
      out.front.setAttribute('d',wavePath(S,waterY-S*.018,S*.031));
    };
    return out;
  }
  /* keuzescherm: motion 'choice' — leeg = 0,86·S, vol = 0,04·S; peil = gekozen duur / max = 18/30 */
  var IS=256, iW=makeWave(document.getElementById('idleWaveHost'),IS);
  var emptyY=IS*.86, fullY=IS*.04, LEVEL=18/30;
  function yFor(l){ return emptyY-(emptyY-fullY)*l; }
  /* actieve sessie: motion 'drain' — het peil zakt gelijkmatig; leeg = 1,05·S */
  var AS=264, aW=makeWave(document.getElementById('aWaveHost'),AS);
  function aY(progress){ var e=AS*1.05, f=AS*.04; return e-(e-f)*(1-progress); }
  aW.set(aY(0));

  /* 3 ── keuzescherm: boog + greep (DurationRing dialHandle), veert naar 18 van 30 min */
  var dial=document.getElementById('dial');
  var dC=148, dR=131, dCirc=2*Math.PI*dR;
  function el(n,a){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); dial.appendChild(e); return e; }
  el('circle',{cx:dC,cy:dC,r:dR+1,stroke:'#000','stroke-width':4,fill:'none'});
  el('circle',{cx:dC,cy:dC,r:dR,stroke:VZ,'stroke-opacity':.22,'stroke-width':1.5,fill:'none'});
  var arc=el('circle',{cx:dC,cy:dC,r:dR,stroke:VZ,'stroke-width':2,'stroke-linecap':'round',fill:'none','stroke-dasharray':dCirc+' '+dCirc,transform:'rotate(-90 '+dC+' '+dC+')'});
  var knob=el('circle',{r:7,fill:'#fff',stroke:VZ,'stroke-width':1.5});
  function setDial(p){
    var q=Math.min(.9999,Math.max(0,p)), a=q*2*Math.PI;
    arc.setAttribute('stroke-dashoffset',dCirc*(1-q));
    knob.setAttribute('cx',dC+dR*Math.sin(a)); knob.setAttribute('cy',dC-dR*Math.cos(a));
  }
  function spring(t){ /* zacht doorveren, zoals withSpring(damping 8, stiffness 90) */
    if(t>=1) return 1; var s=t*1.3; return 1-Math.exp(-5.2*s)*Math.cos(6.5*s);
  }
  var introRaf=0;
  function runIntro(){
    cancelAnimationFrame(introRaf);
    if(reduced){ setDial(LEVEL); iW.set(yFor(LEVEL)); return; }
    var t0=performance.now(), DELAY=260, DUR=1300;
    (function f(now){
      var t=Math.max(0,(now-t0-DELAY)/DUR), k=spring(t);
      setDial(LEVEL*k); iW.set(yFor(LEVEL*k));
      if(t<1) introRaf=requestAnimationFrame(f); else { setDial(LEVEL); iW.set(yFor(LEVEL)); }
    })(t0);
  }
  setDial(LEVEL); iW.set(yFor(LEVEL));

  /* 4 ── actieve sessie: hartslagcurve 1-op-1 uit HapticPulseRings.tsx + bracelet-haptics.ts
        Calm Control (Alpha), rust 70 bpm → startBpm 70, eindtempo max(50, 0,8·70) = 56 bpm.
        Eerst 10 s vast op 70 bpm (SESSION_HOLD_SECONDS), dan 10 s glijden naar 56 (rampSec). */
  var BEAT_LUB=1.07, BEAT_VALLEY=1.015, BEAT_DUB=1.04;
  function eoq(k){ return 1-(1-k)*(1-k); }
  function eis(k){ return .5-.5*Math.cos(Math.PI*k); }
  function beatCurve(e,c){
    if(e<0) return 1;
    var dubAt=Math.round(Math.min(c*.3,350)), rise=80, back=Math.max(160,Math.min(520,c*.45,c-dubAt-rise-40));
    if(e<rise) return 1+(BEAT_LUB-1)*eoq(e/rise);
    if(e<dubAt) return BEAT_LUB+(BEAT_VALLEY-BEAT_LUB)*eis((e-rise)/Math.max(40,dubAt-rise));
    if(e<dubAt+rise) return BEAT_VALLEY+(BEAT_DUB-BEAT_VALLEY)*eoq((e-dubAt)/rise);
    if(e<dubAt+rise+back) return BEAT_DUB+(1-BEAT_DUB)*eis((e-dubAt-rise)/back);
    return 1;
  }
  function waveProgress(e,c){
    var dur=Math.min(1300,Math.max(450,c*.8)); if(e<0||e>=dur) return -1;
    var k=e/dur; return 1-(1-k)*(1-k)*(1-k);
  }
  function bpmAt(sec){ return sec<10 ? 70 : 70+(56-70)*Math.min(1,(sec-10)/10); }

  var circ=document.getElementById('aCircle'), clock=document.getElementById('aClock');
  var wg=document.getElementById('pwg'), wc=document.getElementById('pwc'), wh=document.getElementById('pwh');
  var TOTAL=18*60;
  function fmt(rem){ var m=Math.floor(rem/60), s=rem%60; return m+':'+(s<10?'0':'')+s; }
  var run=false, raf=0, t0=0, lubAt=-1, cycle=857, nextLub=0, lastSec=-1;
  function frame(){
    if(!run) return;
    var now=performance.now(), sec=(now-t0)/1000;
    if(now>=nextLub){ lubAt=nextLub; cycle=Math.round(60000/bpmAt((lubAt-t0)/1000)); nextLub=lubAt+cycle; }
    var e=now-lubAt;
    circ.style.transform='scale('+beatCurve(e,cycle)+')';
    var p=waveProgress(e,cycle);
    if(p<0){ wg.setAttribute('opacity','0'); }
    else { var r=132*(1+.45*p); wc.setAttribute('r',r); wh.setAttribute('r',r); wg.setAttribute('opacity',(.95*(1-p)*(1-p)).toFixed(3)); }
    var s=Math.floor(sec);
    if(s!==lastSec){ lastSec=s; clock.textContent=fmt(Math.max(0,TOTAL-s)); aW.set(aY(Math.min(1,s/TOTAL))); }
    raf=requestAnimationFrame(frame);
  }
  function startSession(){
    if(reduced||run) return;
    run=true; t0=performance.now(); lubAt=-1; nextLub=t0+500; lastSec=-1; clock.textContent=fmt(TOTAL);
    raf=requestAnimationFrame(frame);
  }
  function stopSession(){
    run=false; cancelAnimationFrame(raf);
    circ.style.transform=''; wg.setAttribute('opacity','0'); clock.textContent=fmt(TOTAL); aW.set(aY(0));
  }

  /* 5 ── enkel animeren als het blok in beeld is (IntersectionObserver; scroll-events werken niet in de Wix-iframe) */
  var seen=false;
  function inView(on){
    if(on){
      root.classList.add('play');
      if(!seen){ seen=true; runIntro(); }
      startSession();
    } else { root.classList.remove('play'); stopSession(); }
  }
  if(reduced){ runIntro(); }
  else if('IntersectionObserver' in window){
    new IntersectionObserver(function(en){ inView(en[0].isIntersecting); },{threshold:.25}).observe(root);
    document.addEventListener('visibilitychange',function(){ if(document.hidden) inView(false); });
  } else { inView(true); }
})();
</script>
