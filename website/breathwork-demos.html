  h+='<i class="star'+(Math.random()<.34?' k':'')+'" style="left:'+x.toFixed(1)+'px;top:'+y.toFixed(1)+'px;width:'+(r*2).toFixed(2)+'px;height:'+(r*2).toFixed(2)+'px;--o:'+(.12+Math.random()*.34).toFixed(2)+';--d:'+(4+Math.random()*10).toFixed(1)+'s;--dl:-'+(Math.random()*12).toFixed(1)+'s"></i>'}
  q('#stars').innerHTML=h})();
/* ── actieve sessie ── */
var S=null,cyc=10,rounds=1,b=0,bFrom=0,bPi=-1;
var im=q('#afig'),ag=q('#aglow'),fg=q('#fglow'),prog=q('#aprog'),mk=q('#amk'),anum=q('#anum'),aph=q('#aph'),ameta=q('#ameta');
var AR=99.4,AC=108,AY=134;
q('#atrack').setAttribute('d','M '+(AC-AR)+' '+AY+' A '+AR+' '+AR+' 0 0 1 '+(AC+AR)+' '+AY);
prog.setAttribute('d','M '+(AC-AR)+' '+AY+' A '+AR+' '+AR+' 0 0 1 '+(AC+AR)+' '+AY);
function applyB(v){var s=S.s;im.style.transform='translateY('+s.ty+'px) scale('+(.70+.30*v).toFixed(3)+')';im.style.opacity=(.74+.26*v).toFixed(3);
  ag.style.opacity=(.18+.50*v).toFixed(3);ag.style.transform='scale('+(.70+.44*v).toFixed(3)+')';
  fg.style.opacity=(.16+.40*v).toFixed(3);fg.style.transform='scale('+(.72+.38*v).toFixed(3)+')'}
function arcAt(a){prog.setAttribute('stroke-dashoffset',(1-a).toFixed(4));var th=Math.PI*a;mk.setAttribute('transform','translate('+(AC-AR*Math.cos(th)).toFixed(2)+' '+(AY-AR*Math.sin(th)).toFixed(2)+')')}
function mmss(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function metaAt(el){var r=Math.min(rounds,1+Math.floor(el/cyc));ameta.textContent='ROUND '+r+'/'+rounds+' · '+mmss(Math.max(0,S.min*60-Math.floor(el)))+' left'}
function phLabel(p){return p[0]+(p[2]?' · '+p[2]:'')}
function resetSession(){b=0;bFrom=0;bPi=-1;applyB(0);arcAt(0);anum.textContent=S.ph[0][1].toFixed(1);aph.textContent=phLabel(S.ph[0]);metaAt(0);act.classList.remove('running')}
function setSession(k,tech,min){var s=ST[k];S={k:k,s:s,tech:tech,min:min,ph:TECH[tech]};
  act.style.setProperty('--acc',s.acc);act.style.setProperty('--glow',s.glow);act.style.setProperty('--g1',s.g[1]);
  q('#aeye').textContent=s.eye;q('#atech').textContent=tech;
  im.src=CDN+s.art;im.style.width=im.style.height=s.size+'px';im.style.left=((375-s.size)/2)+'px';im.style.top=((268-s.size)/2)+'px';
  qa('#agrad stop').forEach(function(t,i){t.setAttribute('stop-color',s.g[i])});
  cyc=S.ph.reduce(function(a,p){return a+p[1]},0);rounds=Math.max(1,Math.round(min*60/cyc));resetSession()}
function breathAt(el){var P=S.ph,acc=0,i=0;while(i<P.length-1&&el>=acc+P[i][1]){acc+=P[i][1];i++}
  var p=P[i],lt=Math.min(1,(el-acc)/p[1]);
  if(i!==bPi){bPi=i;bFrom=b;aph.textContent=phLabel(p)}
  if(p[3]!==null)b=bFrom+(p[3]-bFrom)*Math.sin(lt*Math.PI/2);
  anum.textContent=Math.max(0,p[1]-Math.floor(el-acc)).toFixed(1);arcAt(lt);applyB(b);metaAt(el)}
function openAct(inst){act.classList.toggle('inst',!!inst);if(inst)void act.offsetWidth;act.classList.add('open')}
function closeAct(){act.classList.add('inst');act.classList.remove('open','running');void act.offsetWidth;act.classList.remove('inst')}
/* ── tijdlijn op een eigen klok, zodat Pause echt pauzeert ── */
var EV=[],clock=0,last=null,ei=0,state='idle',loopId=null,bStart=-1;
var btn=document.getElementById(BTN_ID),btnTxt=btn?btn.querySelector('span'):null;
function setState(s){state=s;host.classList.toggle('paused',s==='pause');
  if(btn){btn.setAttribute('data-s',s==='idle'?'play':s);var t=s==='pause'?'Resume':(s==='end'?'Replay':'Pause');btnTxt.textContent=t;btn.setAttribute('aria-label',t+' the demo')}}
function finish(){setState('end');act.classList.remove('running');loopId=null}
function loop(ts){if(last===null)last=ts;if(state==='play')clock+=ts-last;last=ts;
  while(ei<EV.length&&clock>=EV[ei][0]){EV[ei][1]();ei++}
  if(bStart>=0){var el=(clock-bStart)/1000;breathAt(Math.min(el,cyc));if(el>=cyc){finish();return}}
  loopId=requestAnimationFrame(loop)}
function resume(){setState('play');last=null;if(!loopId)loopId=requestAnimationFrame(loop)}
function haltLoop(){if(loopId){cancelAnimationFrame(loopId);loopId=null}}
function playTap(){var p=q('#pb');tapOn(p);press(p)}
function playNow(){bStart=clock;act.classList.add('running')}

  var intro=q('#s-intro'),ilnk=q('#i-lnk'),fs=q('#fscroll'),fp=q('#fpers'),feel=q('#s-feel'),
      cap=document.getElementById('inCap'),chips=[].slice.call(document.querySelectorAll('#inChips .in-chip')),cur='cant_focus';
  var ROWIDX={cant_stop_thinking:0,overwhelmed:1,frustrated_angry:2,anxious_nervous:3,brain_fog:4,restless_jittery:5,tired_wired:6,ready_unwind:7};
  function reveal(){intro.classList.add('nt');intro.classList.remove('reveal');void intro.offsetWidth;intro.classList.remove('nt');void intro.offsetWidth;intro.classList.add('reveal')}
  function pick(id){cur=id;var s=SIT[id];setSession(s[0],s[1],s[2]);
    if(cap)cap.textContent=SN[s[0]]+' · '+s[1]+' · '+s[2]+' min';
    chips.forEach(function(c){c.setAttribute('aria-pressed',c.dataset.id===id?'true':'false')})}
  function resetFeel(){feel.classList.remove('go');fs.classList.remove('out');fs.style.transform='';fp.classList.remove('on');qa('.hi').forEach(function(x){x.classList.remove('hi')})}
  function target(){return q('#s-feel [data-id="'+cur+'"]')}
  function flowFull(){var t=1,o=[],tgt,idx=ROWIDX[cur];
    o.push([2400,function(){tapOn(ilnk);press(ilnk)}]);o.push([2550,function(){go(1);feel.classList.add('go')}]);
    var t0=4300;if(idx>=4){o.push([t0-1000,function(){fs.style.transform='translateY('+(-((idx-3)*52+40))+'px)'}])}
    o.push([t0,function(){var e=target();tapOn(e);e.classList.add('hi');press(e)}]);
    o.push([t0+250,function(){fs.classList.add('out');fp.classList.add('on')}]);
    o.push([t0+1150,function(){openAct(false)}]);
    o.push([t0+2700,playTap]);o.push([t0+2850,playNow]);return o}
  function resetAll(open){haltLoop();closeAct();go(0,true);resetFeel();pick(cur);bStart=-1;reveal();clock=0;last=null;ei=0;
    if(open){go(1,true);feel.classList.add('go');fs.classList.add('out');fp.classList.add('on');openAct(true)}}
  function start(){resetAll(false);EV=flowFull();resume()}
  /* gevoel links aangetikt: de keuze is gemaakt, de sessie staat meteen klaar (gepauzeerd) en start na een tik op Play */
  function startChosen(){resetAll(true);EV=[[900,playTap],[1050,playNow]];resume()}
  function fade(fn){host.classList.add('out');setTimeout(function(){fn();host.classList.remove('out')},300)}
  if(btn)btn.addEventListener('click',function(){host.dataset.auto='';
    if(state==='play')setState('pause');else if(state==='pause')resume();else fade(start)});
  chips.forEach(function(c){c.addEventListener('click',function(){var id=c.dataset.id;if(!SIT[id])return;host.dataset.auto='';cur=id;
    if(R){pick(id);showStill();return}
    fade(function(){pick(id);startChosen()});
    var row=c.parentNode;if(row.scrollWidth>row.clientWidth)row.scrollTo({left:c.offsetLeft-row.clientWidth/2+c.offsetWidth/2,behavior:'smooth'});
    var r=AD.getBoundingClientRect();if(r.bottom<0||r.top>window.innerHeight)AD.scrollIntoView({behavior:'smooth',block:'nearest'})})});
  function showStill(){resetAll(true);act.classList.add('running');b=.7;applyB(b);arcAt(.4);anum.textContent=(S.ph[0][1]*.6).toFixed(1);state='end'}
  pick(cur);
  if(R||typeof IntersectionObserver==='undefined'){showStill();if(btn)btn.hidden=true;return}
  resetAll(false);setState('idle');
  new IntersectionObserver(function(es){es.forEach(function(e){var v=e.isIntersecting;
    if(v&&state==='idle')start();
    else if(!v&&state==='play'){setState('pause');host.dataset.auto='1'}
    else if(v&&state==='pause'&&host.dataset.auto==='1'){host.dataset.auto='';resume()}})},{threshold:.35}).observe(AD);
}());
</script>
