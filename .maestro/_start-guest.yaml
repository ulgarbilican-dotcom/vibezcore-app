# Hulpflow: nieuwe gast, app vers geïnstalleerd, welkomstscherm in beeld.
# 31 okt 2026: sinds de app-intro (25 okt, app/intro.tsx, "1 OF 5") komt die eerst bij een verse installatie —
# Skip brengt je naar het welkomstscherm.
appId: com.ubili.vibezcoreapp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip|Reset Yourself"
    timeout: 40000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Reset Yourself"
    timeout: 20000
