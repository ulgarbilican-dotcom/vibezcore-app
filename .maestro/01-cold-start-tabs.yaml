# Nieuwe gebruiker: welkomstscherm → elk tabblad opent en toont zijn scherm.
appId: com.ubili.vibezcoreapp
name: 01 Welkom en alle tabbladen
---
- runFlow: _start-guest.yaml
- waitForAnimationToEnd:
    timeout: 2500
- runFlow: _dismiss-cards.yaml
- takeScreenshot: 01a-welcome
- tapOn:
    text: "Train Your Mind"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Explore Audio Library"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2500
- runFlow: _dismiss-cards.yaml
- takeScreenshot: 01b-library-intro
- tapOn:
    text: "Activity"
    waitToSettleTimeoutMs: 1500
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 2500
- runFlow: _dismiss-cards.yaml
- takeScreenshot: 01c-activity
- tapOn:
    text: "Profile"
    waitToSettleTimeoutMs: 1500
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 2500
- runFlow: _dismiss-cards.yaml
- takeScreenshot: 01d-profile
