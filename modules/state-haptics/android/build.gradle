plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ubili.vibezcoreapp.statehaptics'
version = '1.0.0'

android {
  namespace "com.ubili.vibezcoreapp.statehaptics"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  /* NotificationCompat + ContextCompat.registerReceiver (RECEIVER_NOT_EXPORTED). */
  implementation "androidx.core:core:1.13.1"
}
