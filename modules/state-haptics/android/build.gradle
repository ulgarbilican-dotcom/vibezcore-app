plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ubili.vibezcoreapp.statehaptics'
version = '1.0.0'

android {
  namespace "com.ubili.vibezcoreapp.statehaptics"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  /* NotificationCompat + ContextCompat.registerReceiver (RECEIVER_NOT_EXPORTED). */
  implementation "androidx.core:core:1.13.1"
  /* MediaSessionCompat + MediaStyle: op Samsung/OneUI verschijnt enkel een
     MEDIA-melding betrouwbaar op het vergrendelscherm (zelfde les als
     breath-background, augustus 2026). */
  implementation "androidx.media:media:1.7.0"
}
